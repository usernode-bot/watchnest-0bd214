<!doctype html>
<html lang="en" class="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23f6b94a'/><path d='M23 58c7-22 47-22 54 0-12 20-42 20-54 0Z' fill='%23111827'/><circle cx='50' cy='49' r='10' fill='%23f7f5ee'/></svg>">
  <link rel="stylesheet" href="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.css">
  <link rel="stylesheet" href="/tailwind.css">
  <script>
  // A previous WatchNest worker cached app.js forever. The versioned boot
  // asset bypasses that cache; this reload swaps an already-open client onto
  // the new network-first worker as soon as it claims the page.
  (function () {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      var key = 'watchnest:worker-reload:20260826-3';
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, '1');
      location.reload();
    });
  })();
  </script>
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v) {
      try {
        if (v instanceof Error) return v.stack || v.message;
        if (typeof v === 'string') return v;
        return JSON.stringify(v);
      } catch (_) { return String(v); }
    }
    function post(level, args, meta) {
      try {
        var payload = { sentinel:S, level:level, args:Array.prototype.slice.call(args).map(serialize), ts:Date.now(), url:location.href };
        if (meta) for (var key in meta) payload[key] = meta[key];
        if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var original = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); original.apply(null, arguments); };
    });
    window.addEventListener('error', function (event) {
      post('error', [(event.error && (event.error.stack || event.error.message)) || event.message || 'Error'], { kind:'error' });
    });
    window.addEventListener('unhandledrejection', function (event) {
      post('error', [(event.reason && (event.reason.stack || event.reason.message)) || String(event.reason)], { kind:'unhandledrejection' });
    });
    post('info', ['[dev-console ready]'], { kind:'ready' });
  })();
  </script>
  <script defer src="https://social-vibecoding.usernodelabs.org/usernode-bridge/v1/bridge.js"></script>
  <script defer src="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.js"></script>
  <script defer src="/domain.js"></script>
  <script defer src="/catalog.js"></script>
  <script defer src="/store.js"></script>
  <script defer src="/app.js?v=20260826-3"></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header id="top-bar" class="top-bar">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-3">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14c2-6 14-6 16 0-3 6-13 6-16 0Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </div>
          <div class="min-w-0">
            <p class="truncate text-base font-extrabold tracking-tight">WatchNest</p>
            <p id="header-subtitle" class="truncate text-xs text-slate-400">Your watchlist, on this device</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span id="network-status" class="rounded-full border border-slate-700/70 bg-slate-900/70 px-2 py-1 text-[0.65rem] font-bold text-slate-400">Online</span>
          <button type="button" data-action="open-search" class="un-touch-target grid h-11 w-11 place-items-center rounded-full border border-slate-700/70 bg-slate-900/70 text-slate-200" aria-label="Search WatchNest">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </div>
      </div>
    </header>

    <aside id="remote-warning" class="remote-warning" data-remote-ahead-warning hidden>
      <svg viewBox="0 0 24 24" class="mt-0.5 h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/></svg>
      <div><strong>Another device has newer data.</strong> This browser’s private library may be behind. The warning will stay visible on every screen for this session.</div>
    </aside>

    <main id="screen" class="screen-scroller" tabindex="-1">
      <div class="screen-inner" aria-busy="true">
        <div class="skeleton mt-2 h-40"></div>
        <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
          <div class="skeleton aspect-[2/3]"></div><div class="skeleton aspect-[2/3]"></div><div class="skeleton aspect-[2/3]"></div><div class="skeleton aspect-[2/3]"></div>
        </div>
      </div>
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
      <button type="button" class="nav-button" data-action="navigate" data-screen="home" aria-label="Home">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Home</span>
      </button>
      <button type="button" class="nav-button" data-action="navigate" data-screen="discover" aria-label="Discover">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8Z"/></svg><span>Discover</span>
      </button>
      <button type="button" class="nav-button" data-action="navigate" data-screen="library" aria-label="Library">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5zM9 4v16M9 8h10"/></svg><span>Library</span>
      </button>
      <button type="button" class="nav-button" data-action="navigate" data-screen="upcoming" aria-label="Upcoming">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Upcoming</span>
      </button>
      <button type="button" class="nav-button" data-action="navigate" data-screen="profile" aria-label="Profile">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span>
      </button>
    </nav>
  </div>

  <input id="import-file" class="sr-only" type="file" accept="application/json,.json">
  <div id="live-region" class="sr-only" aria-live="polite"></div>
</body>
</html>
